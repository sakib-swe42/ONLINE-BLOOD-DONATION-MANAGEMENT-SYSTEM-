<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blood Donation App UI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .page {
      display: none;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.4s ease-in-out;
    }
    .active {
      display: flex !important;
      opacity: 1;
      transform: translateY(0);
      flex-direction: column;
      justify-content: space-between;
    }
    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #990000;
      color: white;
      padding: 10px 20px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      z-index: 50;
      display: none;
    }
  </style>
</head>
<body class="bg-[#FF7F7F] font-sans text-gray-800 min-h-screen">

  <!-- Toast Notification -->
  <div id="toast" class="toast">Success!</div>

  <!-- Navigation Menu Bar -->
  <div class="fixed bottom-0 left-0 right-0 w-full bg-[#990000] text-white flex justify-between items-center px-4 py-2 z-40">
    <button onclick="goBack()">← Back</button>
    <button onclick="toggleDarkMode()">🌓 Dark Mode</button>
  </div>

  <!-- Login Page -->
  <section id="loginPage" class="page active w-full h-screen justify-center items-center bg-white px-6">
    <div class="flex flex-col items-center justify-center w-full">
      <h1 class="text-4xl font-extrabold text-[#990000] mb-1">BloodLink</h1>
      <p class="text-gray-600 mb-6">Login to continue</p>
      <input type="email" placeholder="Email Address" class="w-full max-w-sm px-4 py-3 mb-4 border-2 border-red-300 rounded-lg shadow-sm" />
      <input type="password" placeholder="Password" class="w-full max-w-sm px-4 py-3 mb-4 border-2 border-red-300 rounded-lg shadow-sm" />
      <button onclick="showPage('dashboardPage')" class="bg-[#990000] w-full max-w-sm py-3 rounded-lg text-white font-bold shadow-md hover:bg-red-800">Login</button>
      <p class="text-sm mt-4">New here? <a href="#" class="text-[#990000] font-semibold">Register</a></p>
    </div>
  </section>

  <!-- Dashboard Page -->
  <section id="dashboardPage" class="page w-full h-screen justify-center items-center bg-white px-6">
    <div class="flex flex-col items-center justify-center w-full">
      <h2 class="text-3xl font-bold text-[#990000] mb-6">Dashboard</h2>
      <div class="grid grid-cols-2 gap-4 w-full max-w-sm">
        <button onclick="showPage('requestPage')" class="bg-[#990000] text-white p-5 rounded-xl shadow-md hover:bg-red-800">Request Blood</button>
        <button onclick="showPage('donatePage')" class="bg-[#990000] text-white p-5 rounded-xl shadow-md hover:bg-red-800">Donate Blood</button>
        <button onclick="showPage('historyPage')" class="bg-[#990000] text-white p-5 rounded-xl shadow-md hover:bg-red-800">History</button>
        <button onclick="showPage('profilePage')" class="bg-[#990000] text-white p-5 rounded-xl shadow-md hover:bg-red-800">Profile</button>
      </div>
    </div>
  </section>

  <!-- Request Page -->
  <section id="requestPage" class="page w-full h-screen bg-white px-6 py-8 overflow-auto items-center">
    <div class="w-full max-w-sm">
      <h2 class="text-2xl font-bold text-[#990000] mb-4 text-center">Request Blood</h2>
      <form class="w-full" onsubmit="event.preventDefault(); showPage('notificationPage'); showToast('Request Sent Successfully!');">
        <select class="w-full px-4 py-2 mb-4 border-2 border-red-300 rounded-md">
          <option>Select Blood Group</option>
          <option>A+</option>
          <option>B+</option>
          <option>O+</option>
          <option>AB+</option>
        </select>
        <select class="w-full px-4 py-2 mb-4 border-2 border-red-300 rounded-md">
          <option>Select Location</option>
          <option>Dhaka</option>
          <option>Chattogram</option>
          <option>Rajshahi</option>
        </select>
        <input type="text" placeholder="Patient Name" class="w-full px-4 py-2 mb-4 border-2 border-red-300 rounded-md" />
        <input type="text" placeholder="Contact Number" class="w-full px-4 py-2 mb-4 border-2 border-red-300 rounded-md" />
        <select class="w-full px-4 py-2 mb-4 border-2 border-red-300 rounded-md">
          <option>Urgency Level</option>
          <option>High</option>
          <option>Moderate</option>
          <option>Low</option>
        </select>
        <input type="date" class="w-full px-4 py-2 mb-4 border-2 border-red-300 rounded-md" />
        <button type="submit" class="bg-[#990000] w-full py-3 rounded-md text-white font-bold">Send Request</button>
      </form>
    </div>
  </section>

  <!-- Required Pages can go here -->

  <script>
    let historyStack = [];

    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(page => {
        page.classList.remove('active');
        page.style.opacity = 0;
        page.style.transform = 'translateY(20px)';
      });
      const page = document.getElementById(pageId);
      if (page) {
        page.classList.add('active');
        setTimeout(() => {
          page.style.opacity = 1;
          page.style.transform = 'translateY(0)';
        }, 50);
        historyStack.push(pageId);
      }
    }

    function goBack() {
      if (historyStack.length > 1) {
        historyStack.pop();
        const prevPage = historyStack.pop();
        showPage(prevPage);
      } else {
        showPage('dashboardPage');
      }
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.innerText = message;
      toast.style.display = "block";
      setTimeout(() => toast.style.display = "none", 3000);
    }

    function toggleDarkMode() {
      document.body.classList.toggle("dark-mode");
    }

    window.addEventListener('DOMContentLoaded', () => {
      showPage('loginPage');
    });
  </script>
</body>
</html>
